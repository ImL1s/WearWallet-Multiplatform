name: Release Snapshot

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to create or rebuild (e.g. v0.1.0-public.1)'
        required: false
        default: ''

permissions:
  contents: write
  actions: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: '-Dorg.gradle.jvmargs="-Xmx4g -XX:+HeapDumpOnOutOfMemoryError"'

# Builds experimental public snapshot packages. Not Play-signed. Not for real funds.
jobs:
  release-packages:
    name: Build & Publish Snapshot Packages
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Resolve tag name
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Using tag: $TAG"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Materialize Firebase config from examples
        run: |
          cp -n wear/google-services.json.example wear/google-services.json
          cp -n mobile/google-services.json.example mobile/google-services.json

      - name: Create local gradle.properties
        run: |
          cat >> gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx4g -XX:+HeapDumpOnOutOfMemoryError
          org.gradle.parallel=true
          android.useAndroidX=true
          ksp.useKSP2=true
          EOF
          if [ -n "${{ secrets.GITHUB_TOKEN }}" ]; then
            echo "github.actor=${{ github.actor }}" >> gradle.properties
            echo "github.token=${{ secrets.GITHUB_TOKEN }}" >> gradle.properties
          fi

      - name: Unit tests
        id: tests
        continue-on-error: true
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew :coreKmp:testDebugUnitTest :wear:testDebugUnitTest --no-daemon --stacktrace

      - name: Assemble Wear debug APK (public snapshot package)
        id: apk
        continue-on-error: true
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew :wear:assembleDebug --no-daemon --stacktrace

      - name: Stage release assets
        run: |
          mkdir -p dist
          shopt -s nullglob
          for f in wear/build/outputs/apk/debug/*.apk; do
            cp "$f" "dist/WearWallet-wear-${{ steps.meta.outputs.tag }}-debug.apk"
          done
          # Always ship a source snapshot of this sanitized tip.
          # Exclude dist/ so tar does not race its own output archive.
          tar -czf "dist/WearWallet-public-${{ steps.meta.outputs.tag }}-source.tar.gz" \
            --exclude='./dist' --exclude='.git' --exclude='**/build' --exclude='.gradle' \
            --exclude='wear/google-services.json' --exclude='mobile/google-services.json' .
          (
            cd dist
            shasum -a 256 * > SHA256SUMS.txt
          )
          ls -lah dist
          if [ ! -f dist/WearWallet-wear-${{ steps.meta.outputs.tag }}-debug.apk ]; then
            echo "NOTE: debug APK missing (build may have failed); publishing source tarball only."
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: WearWallet public snapshot ${{ steps.meta.outputs.tag }}
          draft: false
          prerelease: true
          generate_release_notes: true
          body: |
            ## Experimental public snapshot

            **Not for real funds.** Not Play-signed. Not a security audit.

            Packages (best-effort):
            - Wear OS **debug** APK when the public tip compiles on Ubuntu CI
            - Source tarball of this sanitized public tip
            - `SHA256SUMS.txt`

            Build notes: see `docs/PUBLIC_BUILD.md`.
            Unit tests conclusion: `${{ steps.tests.outcome }}`
            APK assemble conclusion: `${{ steps.apk.outcome }}`
          files: |
            dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
