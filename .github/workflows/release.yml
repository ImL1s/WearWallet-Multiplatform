name: Release Snapshot

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to create or rebuild (e.g. v0.1.0-public.2)'
        required: false
        default: ''

permissions:
  contents: write
  actions: read
  packages: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: '-Dorg.gradle.jvmargs="-Xmx4g -XX:+HeapDumpOnOutOfMemoryError"'

# Builds experimental public snapshot packages. Not Play-signed. Not for real funds.
jobs:
  release-packages:
    name: Build & Publish Snapshot Packages
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Resolve tag name
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Using tag: $TAG"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Create local gradle.properties
        run: |
          cat >> gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx4g -XX:+HeapDumpOnOutOfMemoryError
          org.gradle.parallel=true
          android.useAndroidX=true
          ksp.useKSP2=true
          EOF
          TOKEN='${{ secrets.GH_TOKEN_PACKAGES }}'
          ACTOR='${{ secrets.GH_ACTOR_NAME }}'
          if [ -z "$TOKEN" ]; then
            TOKEN='${{ secrets.GITHUB_TOKEN }}'
            ACTOR='${{ github.actor }}'
          fi
          if [ -n "$TOKEN" ]; then
            echo "github.actor=${ACTOR:-${{ github.actor }}}" >> gradle.properties
            echo "github.token=$TOKEN" >> gradle.properties
          fi

      # -PpublicSnapshot=true skips the google-services/crashlytics/firebase-perf
      # plugins entirely (see wear/build.gradle.kts, mobile/build.gradle.kts), so
      # this public tip never needs a real (or fake-materialized) google-services.json.
      - name: Assemble Wear debug APK (public snapshot package)
        id: apk
        env:
          GITHUB_ACTOR: ${{ secrets.GH_ACTOR_NAME != '' && secrets.GH_ACTOR_NAME || github.actor }}
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN_PACKAGES != '' && secrets.GH_TOKEN_PACKAGES || secrets.GITHUB_TOKEN }}
        run: ./gradlew :wear:assembleDebug -PpublicSnapshot=true --no-daemon --stacktrace --console=plain

      - name: Stage release assets
        run: |
          mkdir -p dist
          shopt -s nullglob
          for f in wear/build/outputs/apk/debug/*.apk; do
            cp "$f" "dist/WearWallet-wear-${{ steps.meta.outputs.tag }}-debug.apk"
          done
          # Always ship a source snapshot of this sanitized tip.
          # Exclude dist/ so tar does not race its own output archive.
          tar -czf "dist/WearWallet-Multiplatform-${{ steps.meta.outputs.tag }}-source.tar.gz" \
            --exclude='./dist' --exclude='.git' --exclude='**/build' --exclude='.gradle' \
            --exclude='wear/google-services.json' --exclude='mobile/google-services.json' .
          (
            cd dist
            shasum -a 256 * > SHA256SUMS.txt
          )
          ls -lah dist
          if [ ! -f dist/WearWallet-wear-${{ steps.meta.outputs.tag }}-debug.apk ]; then
            echo "::error::debug APK missing after assemble"
            exit 1
          fi

      - name: Drop prior GitHub Releases for this tag (if any)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # softprops can leave a draft + published pair for the same tag when
          # finalize retries; delete every release object for this tag first.
          TAG="${{ steps.meta.outputs.tag }}"
          ids=$(gh api "repos/${{ github.repository }}/releases" \
            --jq ".[] | select(.tag_name==\"$TAG\") | .id")
          for id in $ids; do
            echo "Deleting release id=$id for tag $TAG"
            gh api -X DELETE "repos/${{ github.repository }}/releases/$id"
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: WearWallet public snapshot ${{ steps.meta.outputs.tag }}
          draft: false
          prerelease: true
          generate_release_notes: true
          body: |
            ## Experimental public snapshot

            **Not for real funds.** Not Play-signed. Not a security audit.

            Packages:
            - Wear OS **debug** APK
            - Source tarball of this sanitized public tip
            - `SHA256SUMS.txt`

            Build notes: see `docs/PUBLIC_BUILD.md`.
            APK assemble conclusion: `${{ steps.apk.outcome }}`
            Unit tests: not gated in public CI (Wear assembleDebug + docs only).
          files: |
            dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
