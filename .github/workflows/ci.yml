name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  checks: write
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: '-Dorg.gradle.jvmargs="-Xmx4g -XX:+HeapDumpOnOutOfMemoryError"'

# Public CI: GitHub-hosted only. Never register self-hosted runners on this repo.
jobs:
  build-test:
    name: Test & Debug Build (Ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Materialize Firebase config from examples
        run: |
          # Public tip ships *.example only; Google Services plugin requires the real filename.
          cp -n wear/google-services.json.example wear/google-services.json
          cp -n mobile/google-services.json.example mobile/google-services.json

      - name: Create local gradle.properties
        run: |
          cat >> gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx4g -XX:+HeapDumpOnOutOfMemoryError
          org.gradle.parallel=true
          android.useAndroidX=true
          ksp.useKSP2=true
          EOF
          if [ "${{ github.event.pull_request.head.repo.fork }}" != "true" ] && [ -n "${{ secrets.GITHUB_TOKEN }}" ]; then
            echo "github.actor=${{ github.actor }}" >> gradle.properties
            echo "github.token=${{ secrets.GITHUB_TOKEN }}" >> gradle.properties
          fi

      - name: Unit tests (coreKmp + wear)
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./gradlew :coreKmp:testDebugUnitTest :wear:testDebugUnitTest --no-daemon --stacktrace

      - name: Assemble Wear debug APK
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./gradlew :wear:assembleDebug --no-daemon --stacktrace

      - name: Upload JUnit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-reports
          path: '**/build/test-results/**/*.xml'
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload Wear debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: wear-debug-apk
          path: 'wear/build/outputs/apk/debug/*.apk'
          retention-days: 14
          if-no-files-found: warn
