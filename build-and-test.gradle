plugins {
    id 'application'
    id 'org.jetbrains.kotlin.jvm' version '1.9.20'
}

application {
    mainClass = 'SimplifiedKotlinTestKt'
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:1.9.20"
}

repositories {
    mavenCentral()
}

sourceSets {
    main {
        kotlin {
            srcDir '.'
            include 'SimplifiedKotlinTest.kt'
        }
    }
}

task runTest(type: JavaExec) {
    classpath = sourceSets.main.runtimeClasspath
    main = 'SimplifiedKotlinTestKt'
}